<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk / Daftar — LanikaStore</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="auth-logo">LanikaStore</div>
  <p class="auth-subtitle">Belanja nyaman, harga terjangkau</p>

  <!-- Tabs -->
  <div class="auth-tabs">
    <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Masuk</div>
    <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Daftar</div>
  </div>

  <!-- Login Form -->
  <form id="login-form" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="login-email" class="form-control" placeholder="email@contoh.com" required />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="login-password" class="form-control" placeholder="Minimal 6 karakter" required />
    </div>
    <div id="login-error" class="form-error" style="margin-bottom:0.75rem;"></div>
    <button type="submit" class="btn btn-primary btn-full" id="btn-login">
      Masuk ke Akun
    </button>
  </form>

  <!-- Register Form (hidden) -->
  <form id="register-form" style="display:none;" onsubmit="handleRegister(event)">
    <div class="form-group">
      <label class="form-label">Nama Lengkap</label>
      <input type="text" id="reg-name" class="form-control" placeholder="Nama Anda" required />
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" id="reg-email" class="form-control" placeholder="email@contoh.com" required />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="reg-password" class="form-control" placeholder="Isi password anda" required />
    </div>
    <div class="form-group">
      <label class="form-label">Konfirmasi Password</label>
      <input type="password" id="reg-confirm" class="form-control" placeholder="Ulangi password" required />
    </div>
    <div id="register-error" class="form-error" style="margin-bottom:0.75rem;"></div>
    <button type="submit" class="btn btn-primary btn-full" id="btn-register">
      Buat Akun
    </button>
  </form>

  <div style="text-align:center;margin-top:1.25rem;">
    <a href="index.html" style="font-size:0.8rem;color:var(--text-muted);">← Kembali ke Beranda</a>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Redirect jika sudah login
  if (Auth.isLoggedIn()) window.location.href = 'index.html';

  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-register').classList.toggle('active', !isLogin);
    document.getElementById('login-form').style.display = isLogin ? '' : 'none';
    document.getElementById('register-form').style.display = isLogin ? 'none' : '';
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-login');
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    const res = await apiRequest('auth.php?action=login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value,
      }),
    });

    if (res?.success) {
      Auth.login(res.data.token, res.data.user);
      showToast('Login berhasil! Selamat datang 👋', 'success');
      const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
      setTimeout(() => window.location.href = redirect, 800);
    } else {
      errEl.textContent = res?.message || 'Login gagal. Periksa email dan password Anda.';
      btn.disabled = false;
      btn.textContent = 'Masuk ke Akun';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-register');
    const errEl = document.getElementById('register-error');
    errEl.textContent = '';

    const password = document.getElementById('reg-password').value;
    const confirm  = document.getElementById('reg-confirm').value;

    if (password !== confirm) {
      errEl.textContent = 'Password dan konfirmasi tidak cocok.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Mendaftar...';

    const res = await apiRequest('auth.php?action=register', {
      method: 'POST',
      body: JSON.stringify({
        name:     document.getElementById('reg-name').value,
        email:    document.getElementById('reg-email').value,
        password: password,
      }),
    });

    if (res?.success) {
      Auth.login(res.data.token, res.data.user);
      showToast('Akun berhasil dibuat! Selamat berbelanja 🎉', 'success');
      setTimeout(() => window.location.href = 'index.html', 800);
    } else {
      errEl.textContent = res?.message || 'Gagal mendaftar.';
      btn.disabled = false;
      btn.textContent = 'Buat Akun';
    }
  }
</script>
</body>
</html>
