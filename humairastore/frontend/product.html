<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Produk — LanikaStore</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="navbar-container"></div>

<main class="container" style="padding-top:2rem;padding-bottom:4rem;">

  <!-- Breadcrumb -->
  <div class="page-breadcrumb" style="margin-bottom:2rem;">
    <a href="index.html">Beranda</a> / <span id="breadcrumb-name">Produk</span>
  </div>

  <!-- Skeleton -->
  <div id="skeleton-detail" class="product-detail-grid">
    <div class="skeleton" style="aspect-ratio:4/3;border-radius:16px;"></div>
    <div>
      <div class="skeleton" style="height:14px;width:80px;margin-bottom:1rem;border-radius:4px;"></div>
      <div class="skeleton" style="height:32px;margin-bottom:0.5rem;border-radius:4px;"></div>
      <div class="skeleton" style="height:32px;width:60%;margin-bottom:1rem;border-radius:4px;"></div>
      <div class="skeleton" style="height:14px;margin-bottom:0.5rem;border-radius:4px;"></div>
      <div class="skeleton" style="height:14px;margin-bottom:0.5rem;border-radius:4px;"></div>
      <div class="skeleton" style="height:14px;width:70%;margin-bottom:1.5rem;border-radius:4px;"></div>
      <div class="skeleton" style="height:48px;border-radius:8px;"></div>
    </div>
  </div>

  <!-- Product Detail (hidden until loaded) -->
  <div id="product-detail" class="product-detail-grid" style="display:none;">
    <div class="product-detail-img">
      <img id="detail-img" src="" alt="" />
    </div>
    <div class="product-detail-info">
      <span id="detail-category" class="category-badge"></span>
      <h1 class="product-detail-title" id="detail-name"></h1>
      <div class="product-detail-price" id="detail-price"></div>
      <div class="stock-info">
        <span class="stock-dot" id="stock-dot"></span>
        <span id="detail-stock"></span>
      </div>
      <p class="product-detail-desc" id="detail-desc"></p>

      <div class="qty-selector">
        <label>Jumlah</label>
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <span class="qty-value" id="qty-value">1</span>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>

      <div class="detail-actions">
        <button class="btn btn-primary btn-lg" style="flex:1" id="btn-add-cart" onclick="handleAddToCart()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Tambah ke Keranjang
        </button>
        <a href="cart.html" class="btn btn-outline btn-lg">Beli Sekarang</a>
      </div>
    </div>
  </div>

  <!-- Error state -->
  <div id="error-state" class="empty-state" style="display:none;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <h3>Produk tidak ditemukan</h3>
    <p>Produk yang Anda cari mungkin telah dihapus atau tidak tersedia.</p>
    <a href="index.html" class="btn btn-primary">Kembali Belanja</a>
  </div>

  <!-- Related Products -->
  <div id="related-section" style="display:none;margin-top:4rem;">
    <hr class="divider" style="margin-bottom:2rem;" />
    <h2 class="section-title" style="margin-bottom:1.5rem;">Produk <em>Serupa</em></h2>
    <div class="product-grid" id="related-grid"></div>
  </div>

</main>

<!-- Footer -->
<footer class="footer">
  <div class="footer-bottom">
    <p>© 2026 LanikaStore. Dibuat dengan ❤ di Indonesia.</p>
  </div>
</footer>

<script src="js/api.js"></script>
<script>
  let currentProduct = null;
  let quantity = 1;

  async function loadProduct() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if (!slug) {
      showError();
      return;
    }

    const res = await apiRequest(`products.php?action=detail&slug=${encodeURIComponent(slug)}`);

    document.getElementById('skeleton-detail').style.display = 'none';

    if (!res?.success) {
      showError();
      return;
    }

    const { product, related } = res.data;
    currentProduct = product;

    // Update page title & breadcrumb
    document.title = `${product.name} — LanikaStore`;
    document.getElementById('breadcrumb-name').textContent = product.name;

    // Fill details
    document.getElementById('detail-img').src = product.image_url || 'https://via.placeholder.com/600x450';
    document.getElementById('detail-img').alt = product.name;
    document.getElementById('detail-category').textContent = product.category_name || '';
    document.getElementById('detail-name').textContent = product.name;
    document.getElementById('detail-price').textContent = formatRupiah(product.price);
    document.getElementById('detail-desc').textContent = product.description || 'Tidak ada deskripsi.';

    // Stock
    const stockDot  = document.getElementById('stock-dot');
    const stockText = document.getElementById('detail-stock');
    const btnCart   = document.getElementById('btn-add-cart');

    if (product.stock === 0) {
      stockDot.className = 'stock-dot out';
      stockText.textContent = 'Stok habis';
      btnCart.disabled = true;
      btnCart.textContent = 'Stok Habis';
    } else if (product.stock < 10) {
      stockDot.className = 'stock-dot low';
      stockText.textContent = `Sisa ${product.stock} unit`;
    } else {
      stockDot.className = 'stock-dot';
      stockText.textContent = `Stok tersedia (${product.stock} unit)`;
    }

    document.getElementById('product-detail').style.display = 'grid';

    // Related
    if (related?.length > 0) {
      document.getElementById('related-section').style.display = 'block';
      document.getElementById('related-grid').innerHTML = related.map(renderProductCard).join('');
    }
  }

  function showError() {
    document.getElementById('skeleton-detail').style.display = 'none';
    document.getElementById('error-state').style.display = 'block';
  }

  function changeQty(delta) {
    if (!currentProduct) return;
    quantity = Math.max(1, Math.min(currentProduct.stock, quantity + delta));
    document.getElementById('qty-value').textContent = quantity;
  }

  async function handleAddToCart() {
    if (!currentProduct) return;
    if (!Auth.requireLogin()) return;
    await addToCart(currentProduct.id, quantity);
  }

  loadProduct();
</script>
</body>
</html>
