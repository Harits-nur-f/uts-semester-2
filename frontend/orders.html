<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesanan Saya — LanikaStore</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="navbar-container"></div>

<main class="container" style="padding-bottom:4rem;">

  <div class="page-title-section">
    <h1 class="page-title">Pesanan <em style="font-style:italic;color:var(--accent)">Saya</em></h1>
    <p class="page-breadcrumb"><a href="index.html">Beranda</a> / Pesanan Saya</p>
  </div>

  <div id="loading" style="text-align:center;padding:3rem;color:var(--text-muted);">
    <p>Memuat data pesanan...</p>
  </div>

  <div id="empty-state" class="empty-state" style="display:none;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
    </svg>
    <h3>Belum ada pesanan</h3>
    <p>Anda belum pernah melakukan pembelian.</p>
    <a href="index.html" class="btn btn-primary">Mulai Belanja</a>
  </div>

  <div id="orders-list" style="display:none;"></div>

  <!-- Detail Modal -->
  <div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;backdrop-filter:blur(4px);" onclick="closeModal()">
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:600px;width:90%;margin:5vh auto;max-height:90vh;overflow-y:auto;padding:2rem;" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
        <h2 style="font-family:var(--font-display);font-size:1.3rem;">Detail Pesanan</h2>
        <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕ Tutup</button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>

</main>

<footer class="footer">
  <div class="footer-bottom">
    <p>© 2026 LanikaStore. Dibuat dengan ❤ di Indonesia.</p>
  </div>
</footer>

<script src="js/api.js"></script>
<script>
  async function loadOrders() {
    if (!Auth.requireLogin()) return;

    const res = await apiRequest('orders.php?action=list');
    document.getElementById('loading').style.display = 'none';

    if (!res?.success) {
      showToast('Gagal memuat pesanan.', 'error');
      return;
    }

    if (res.data.length === 0) {
      document.getElementById('empty-state').style.display = 'block';
      return;
    }

    document.getElementById('orders-list').style.display = 'block';
    document.getElementById('orders-list').innerHTML = res.data.map(order => `
      <div class="order-card" onclick="loadOrderDetail(${order.id})" style="cursor:pointer;">
        <div>
          <div style="font-weight:600;margin-bottom:0.2rem;">Pesanan #${order.id}</div>
          <div class="order-id">${order.item_count} item · ${order.shipping_city}</div>
          <div class="order-date">${formatDate(order.created_at)}</div>
        </div>
        <div style="margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:0.5rem;">
          ${statusBadge(order.status)}
          <div class="order-amount">${formatRupiah(order.total_amount)}</div>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:var(--text-muted);flex-shrink:0;"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    `).join('');
  }

  async function loadOrderDetail(orderId) {
    document.getElementById('modal-content').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">Memuat...</p>';
    document.getElementById('modal-overlay').style.display = 'block';
    document.body.style.overflow = 'hidden';

    const res = await apiRequest(`orders.php?action=detail&id=${orderId}`);
    if (!res?.success) {
      document.getElementById('modal-content').innerHTML = '<p style="color:var(--danger)">Gagal memuat detail.</p>';
      return;
    }

    const { order, items } = res.data;

    document.getElementById('modal-content').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1.5rem;">
        <div>
          <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:0.25rem;">No. Pesanan</div>
          <div style="font-weight:600;">#${order.id}</div>
        </div>
        <div>
          <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:0.25rem;">Status</div>
          <div>${statusBadge(order.status)}</div>
        </div>
        <div>
          <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:0.25rem;">Tanggal</div>
          <div>${formatDate(order.created_at)}</div>
        </div>
        <div>
          <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:0.25rem;">Total</div>
          <div style="color:var(--accent);font-weight:600;">${formatRupiah(order.total_amount)}</div>
        </div>
      </div>

      <div style="background:var(--bg-secondary);border-radius:var(--radius);padding:1rem;margin-bottom:1.5rem;">
        <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:0.5rem;">Alamat Pengiriman</div>
        <div style="font-weight:500;">${order.shipping_name}</div>
        <div style="font-size:0.85rem;color:var(--text-secondary);">${order.shipping_phone}</div>
        <div style="font-size:0.85rem;color:var(--text-secondary);">${order.shipping_address}, ${order.shipping_city}</div>
        ${order.notes ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.4rem;font-style:italic;">Catatan: ${order.notes}</div>` : ''}
      </div>

      <div style="font-size:0.8rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:0.75rem;">Item Pesanan</div>
      ${items.map(item => `
        <div style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem 0;border-bottom:1px solid var(--border-subtle);">
          <img src="${item.image_url}" style="width:52px;height:52px;border-radius:6px;object-fit:cover;background:var(--bg-secondary);" />
          <div style="flex:1;">
            <div style="font-size:0.875rem;font-weight:500;">${item.name}</div>
            <div style="font-size:0.78rem;color:var(--text-muted);">× ${item.quantity} · ${formatRupiah(item.price)}</div>
          </div>
          <div style="font-size:0.9rem;color:var(--accent);">${formatRupiah(item.subtotal)}</div>
        </div>
      `).join('')}

      ${order.status === 'pending' ? `
        <button class="btn btn-danger btn-sm" style="margin-top:1.25rem;" onclick="cancelOrder(${order.id})">
          Batalkan Pesanan
        </button>
      ` : ''}
    `;
  }

  async function cancelOrder(orderId) {
    if (!confirm('Yakin ingin membatalkan pesanan ini?')) return;
    const res = await apiRequest(`orders.php?action=cancel&id=${orderId}`, { method: 'POST' });
    if (res?.success) {
      showToast('Pesanan dibatalkan.', 'success');
      closeModal();
      loadOrders();
    } else {
      showToast(res?.message || 'Gagal membatalkan pesanan.', 'error');
    }
  }

  function closeModal() {
    document.getElementById('modal-overlay').style.display = 'none';
    document.body.style.overflow = '';
  }

  loadOrders();
</script>
</body>
</html>
